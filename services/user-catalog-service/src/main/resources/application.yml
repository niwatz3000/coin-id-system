server:
  port: 8080

spring:
  application:
    name: user-catalog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32-chars-min}
    expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info

