server:
  port: 8080

spring:
  application:
    name: user-catalog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coinid}
    username: ${SPRING_DATASOURCE_USERNAME:coinid}
    password: ${SPRING_DATASOURCE_PASSWORD:coinid}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32-chars-min}
    expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
