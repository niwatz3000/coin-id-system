server:
  port: 8099

spring:
  application:
    name: image-ingestion-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://34.124.164.12:5432/coin-id-pg}
    username: ${SPRING_DATASOURCE_USERNAME:coinid}
    password: ${SPRING_DATASOURCE_PASSWORD:coinid}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

gcp:
  project-id: ${GOOGLE_CLOUD_PROJECT:coinid-local}
  storage:
    bucket: ${GCS_BUCKET:coin-images-dev}
  pubsub:
    topic: ${PUBSUB_TOPIC:coin-image-uploaded}

management:
  endpoints:
    web:
      exposure:
        include: health,info
