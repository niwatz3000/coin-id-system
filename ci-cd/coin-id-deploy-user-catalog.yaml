# CD Deploy: coin-id-user-catalog
# Deploy image built with the same commit tag ($SHORT_SHA).

steps:
  - id: deploy-user-catalog
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - coin-id-user-catalog
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/user-catalog-service:$SHORT_SHA'
      - '--region=${_REGION}'
      # รวม Environment Variables ไว้ใน flag เดียว
      - '--set-env-vars=DB_URL=${_DB_URL},DB_USERNAME=${_DB_USERNAME},DB_PASSWORD=${_DB_PASSWORD},SPRING_DATASOURCE_USERNAME=coinid'
      # ดึง Secret Password จาก Secret Manager
      - '--set-secrets=SPRING_DATASOURCE_PASSWORD=coin-id-db-password:latest'
      # เชื่อมต่อ Cloud SQL Instance
      - '--add-cloudsql-instances=gcp-web-example:asia-southeast1:coin-id-pg'
      - '--platform=managed'
      - '--quiet'


options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s

substitutions:
  _REGION: asia-southeast1
  _REPO: coin-id-repo
