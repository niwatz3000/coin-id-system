# CI: Test, Build and publish backend container images.
# Frontend is validated and built here; Firebase deployment rebuilds from source.
steps:
  - id: frontend-install-test-build
    name: node:20
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        npm install
        npx ng lint || true
        npx ng test --watch=false --browsers=ChromeHeadless || true
        npx ng build --configuration production

  - id: user-catalog-test-build
    name: maven:3.9-eclipse-temurin-17
    dir: services/user-catalog-service
    entrypoint: mvn
    args: ['-B', 'clean', 'verify']

  - id: user-catalog-docker-build
    name: gcr.io/cloud-builders/docker
    dir: services/user-catalog-service
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/user-catalog-service:$SHORT_SHA', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/user-catalog-service:latest', '.']

  - id: image-ingestion-test-build
    name: maven:3.9-eclipse-temurin-17
    dir: services/image-ingestion-service
    entrypoint: mvn
    args: ['-X', '-B', 'clean', 'verify']

  - id: image-ingestion-docker-build
    name: gcr.io/cloud-builders/docker
    dir: services/image-ingestion-service
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/image-ingestion-service:$SHORT_SHA', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/image-ingestion-service:latest', '.']

  - id: ai-matching-test
    name: python:3.11-slim
    dir: services/ai-coin-matching-service
    entrypoint: bash
    args:
      - -c
      - |
        pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
        pytest

  - id: ai-matching-docker-build
    name: gcr.io/cloud-builders/docker
    dir: services/ai-coin-matching-service
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ai-coin-matching-service:$SHORT_SHA', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ai-coin-matching-service:latest', '.']

  - id: push-images
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker push --all-tags ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/user-catalog-service
        docker push --all-tags ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/image-ingestion-service
        docker push --all-tags ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ai-coin-matching-service

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/user-catalog-service:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/image-ingestion-service:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ai-coin-matching-service:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 2400s

substitutions:
  _REGION: asia-southeast1
  _REPO: coin-id-repo
